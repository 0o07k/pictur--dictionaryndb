name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Arrange files (flat files -> www/ and assets/)
        run: |
          mkdir -p www assets
          cp app.js style.css index.html sw.js manifest.webmanifest icon-192.png icon-512.png www/
          cp icon-only.png assets/
          ls -R www assets

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Add Android
        run: npx cap add android

      - name: Allow text-to-speech engine (Android 11+)
        run: |
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          q = '<queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries>'
          if "TTS_SERVICE" not in s:
              s = s.replace("</manifest>", "    " + q + "\n</manifest>")
              open(p, "w", encoding="utf-8").write(s)
          print(s)
          PY

      - name: App icon (optional)
        run: npx @capacitor/assets generate --android
        continue-on-error: true

      - name: Sync web files
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dictionary-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
